version: "3.9"

services:
  app:
    build:
      context: .
      args:
        DEV: "true"       # Fixed: Removed the dash to make it a mapping
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app        # Fixed: Added the missing slash after the dot
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
   

    